name: CD Pipeline

 
on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    name: Construir y publicar imagen Docker
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "tag=ghcr.io/${{ github.repository }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ghcr.io/${{ github.repository }}:latest

  deploy:
    name: Desplegar a produccion
    needs: build-and-push-image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy-url.outputs.url }}
    steps:
      - name: Disparar despliegue en Render
 
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Registrar URL del sitio desplegado
        id: deploy-url
        run: echo "url=https://ci-cd-demo.onrender.com" >> "$GITHUB_OUTPUT"

      - name: Confirmar despliegue
        run: echo "🚀 Despliegue disparado para la imagen ${{ needs.build-and-push-image.outputs.image-tag }}"
